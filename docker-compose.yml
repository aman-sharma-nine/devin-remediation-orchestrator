services:
  orchestrator:
    build: .
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    env_file:
      - ${ORCHESTRATOR_ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /data/orchestrator.db
    volumes:
      - orchestrator-data:/data
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  orchestrator-data:
